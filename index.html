<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega Clicker Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            display: flex;
            flex-wrap: wrap;
            width: 100%;
            max-width: 900px;
            background-color: #1e1e1e;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* Sekcja Klikania */
        .clicker-section {
            flex: 1;
            min-width: 300px;
            padding: 40px 20px;
            text-align: center;
            border-right: 2px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .score-display {
            font-size: 48px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 5px;
        }

        .stats {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .click-target {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #ff9800, #f44336);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 40px rgba(255, 152, 0, 0.4);
            transition: transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
            border: 5px solid #ffeb3b;
        }

        .click-target:active {
            transform: scale(0.95);
            box-shadow: 0 0 20px rgba(255, 152, 0, 0.6);
        }

        /* Sekcja Sklepu */
        .shop-section {
            flex: 1;
            min-width: 300px;
            padding: 30px;
            background-color: #252525;
            display: flex;
            flex-direction: column;
        }

        .shop-title {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            color: #4caf50;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .upgrade-card {
            background-color: #333;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .upgrade-card:hover {
            background-color: #3f3f3f;
        }

        .upgrade-info h3 {
            font-size: 18px;
            color: #fff;
            margin-bottom: 5px;
        }

        .upgrade-info p {
            font-size: 12px;
            color: #bbb;
        }

        .buy-btn {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .buy-btn:hover {
            background-color: #45a049;
        }

        .buy-btn:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
        }

        .reset-btn {
            margin-top: auto;
            background-color: #f44336;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 12px;
        }

        /* Kontener na Native Banner */
        .ad-container-native {
            background-color: #1e1e1e;
            padding: 10px;
            text-align: center;
            margin-bottom: 20px;
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="clicker-section">
            <div class="score-display" id="score">0</div>
            <div class="stats">
                Moc kliknięcia: <span id="clickPower">1</span> | 
                Na sekundę: <span id="autoPower">0</span> <br>
                <small style="color: #666;">Następna reklama za: <span id="adTimer">50</span> s</small>
            </div>
            
            <div class="click-target" onclick="clickAction()">KLIK!</div>
        </div>

        <div class="shop-section">
            
            <div class="ad-container-native">
                <script async="async" data-cfasync="false" src="https://pl29687446.effectivecpmnetwork.com/7055b53151e7b16b743503483a46ee84/invoke.js"></script>
                <div id="container-7055b53151e7b16b743503483a46ee84"></div>
            </div>
            <h2 class="shop-title">Sklep Ulepszeń</h2>

            <div class="upgrade-card">
                <div class="upgrade-info">
                    <h3>Mocne Palce</h3>
                    <p>Poziom: <span id="lvlClick">0</span> (+1 do kliknięcia)</p>
                </div>
                <button class="buy-btn" id="btnClick" onclick="buyClickUpgrade()">Cena: 50</button>
            </div>

            <div class="upgrade-card">
                <div class="upgrade-info">
                    <h3>Robot Górnik</h3>
                    <p>Poziom: <span id="lvlAuto">0</span> (+2 / sekundę)</p>
                </div>
                <button class="buy-btn" id="btnAuto" onclick="buyAutoUpgrade()">Cena: 200</button>
            </div>

            <button class="reset-btn" onclick="resetGame()">Resetuj postęp gry</button>
        </div>
    </div>

    <script>
        let gameData = {
            score: 0,
            clickPower: 1,
            autoPower: 0,
            lvlClick: 0,
            costClick: 50,
            lvlAuto: 0,
            costAuto: 200
        };

        // Licznik czasu do reklamy (50 sekund)
        let timeToNextAd = 50;

        const savedData = localStorage.getItem("megaClickerSaveTime");
        if (savedData) {
            gameData = JSON.parse(savedData);
        }

        const elScore = document.getElementById("score");
        const elClickPower = document.getElementById("clickPower");
        const elAutoPower = document.getElementById("autoPower");
        const elAdTimer = document.getElementById("adTimer");
        
        const elLvlClick = document.getElementById("lvlClick");
        const elBtnClick = document.getElementById("btnClick");
        
        const elLvlAuto = document.getElementById("lvlAuto");
        const elBtnAuto = document.getElementById("btnAuto");

        function updateUI() {
            elScore.innerText = Math.floor(gameData.score);
            elClickPower.innerText = gameData.clickPower;
            elAutoPower.innerText = gameData.autoPower;
            elAdTimer.innerText = timeToNextAd;

            elLvlClick.innerText = gameData.lvlClick;
            elBtnClick.innerText = "Cena: " + Math.floor(gameData.costClick);
            elBtnClick.disabled = gameData.score < gameData.costClick;

            elLvlAuto.innerText = gameData.lvlAuto;
            elBtnAuto.innerText = "Cena: " + Math.floor(gameData.costAuto);
            elBtnAuto.disabled = gameData.score < gameData.costAuto;
        }

        function saveGame() {
            localStorage.setItem("megaClickerSaveTime", JSON.stringify(gameData));
        }

        // Zwykłe kliknięcie (bez sprawdzania ilości klików)
        function clickAction() {
            gameData.score += gameData.clickPower;
            updateUI();
        }

        // FUNKCJA DYNAMICZNEGO WYWOŁYWANIA POPUNDERA
        function triggerPopunder() {
            const oldScript = document.getElementById("adsterra-popunder-script");
            if (oldScript) {
                oldScript.remove();
            }

            const popScript = document.createElement("script");
            popScript.id = "adsterra-popunder-script";
            popScript.src = "https://pl29687445.effectivecpmnetwork.com/1f/6f/4b/1f6f4b560ba0996bea0e8d9ed5bb6378.js";
            document.body.appendChild(popScript);
        }

        function buyClickUpgrade() {
            if (gameData.score >= gameData.costClick) {
                gameData.score -= gameData.costClick;
                gameData.clickPower += 1;
                gameData.lvlClick += 1;
                gameData.costClick *= 1.5;
                updateUI();
            }
        }

        function buyAutoUpgrade() {
            if (gameData.score >= gameData.costAuto) {
                gameData.score -= gameData.costAuto;
                gameData.autoPower += 2;
                gameData.lvlAuto += 1;
                gameData.costAuto *= 1.4;
                updateUI();
            }
        }

        // Pętla 100ms dla płynnego auto-clickera
        setInterval(function() {
            if (gameData.autoPower > 0) {
                gameData.score += gameData.autoPower / 10; 
                updateUI();
            }
        }, 100);

        // GŁÓWNA PĘTLA CZASOWA (Wywoływana co 1 sekundę)
        setInterval(function() {
            saveGame(); // Zapis gry co sekundę

            // Odliczanie czasu do reklamy
            timeToNextAd--;
            
            if (timeToNextAd <= 0) {
                triggerPopunder(); // Odpalenie Popundera po 50 sekundach
                timeToNextAd = 50;  // Reset licznika z powrotem na 50 sekund
            }
            
            elAdTimer.innerText = timeToNextAd;
        }, 1000);

        function resetGame() {
            if (confirm("Czy na pewno chcesz zresetować grę?")) {
                localStorage.removeItem("megaClickerSaveTime");
                location.reload();
            }
        }

        updateUI();
    </script>

    <script src="https://pl29687447.effectivecpmnetwork.com/19/f6/2b/19f62bf091a19b56f0538cbfbb8b8587.js"></script>
    </body>
</html>
